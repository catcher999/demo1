spring.application.name=demo1

# 引入本地敏感配置（此文件已被 .gitignore 忽略）
# 若不存在本机 application-local.properties，将使用下方默认值；建议自建该文件覆盖敏感字段
spring.config.import=optional:application-local.properties

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/demo_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
# password 见 application-local.properties
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml

# Jwt 配置
jwt.expire=7200000
# secret 见 application-local.properties

# Redis 配置（Redis Cloud 云服务）
spring.data.redis.host=drain-reading-ultrasoft-70548.db.redis.io
spring.data.redis.port=17041
spring.data.redis.username=default
# password 见 application-local.properties
spring.data.redis.timeout=2000ms

# 邮件配置（QQ邮箱）
spring.mail.host=smtp.qq.com
spring.mail.port=587
# username 和 password 见 application-local.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# LLM 配置（第一版用 DeepSeek，可插拔切换其他厂商）
llm.provider=deepseek
llm.base-url=https://api.deepseek.com
llm.model=deepseek-chat
# api-key 见 application-local.properties

# RabbitMQ 配置（见 application-local.properties 填账号密码）
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# 消费者ACK：手动确认（保证消息不丢失）
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# 关闭自动重试（避免重复退款/重复消费，失败直接 NACK 进死信队列）
spring.rabbitmq.listener.simple.retry.enabled=false

# 图片生成服务（mock / pollinations / ...）
image.service=mock

# 支付宝沙箱配置（敏感字段 private-key / public-key 见 application-local.properties）
alipay.app-id=
alipay.gateway=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.notify-url=http://localhost:8080/api/recharge/notify
alipay.return-url=http://localhost:8080/api/recharge/return
alipay.sign-type=RSA2
alipay.charset=UTF-8
alipay.format=json
